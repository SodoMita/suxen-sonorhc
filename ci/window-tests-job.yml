# The window-level resolution test job, as a fragment.
#
# Why it lives here and not in .github/workflows/: pushing a workflow file needs
# a token with the `workflow` scope (a GitHub App never has it), and the token
# that pushed the resolution fix only had Contents: read and write. Same reason
# ci/godot-ci.yml existed before it was moved by hand.
#
# Two ways to land it:
#   1. Add the job below to .github/workflows/godot-ci.yml, under `jobs:` next to
#      headless-test, then commit. GitHub's web editor can do this directly.
#   2. Or run `git apply ci/window-tests.patch` from the repository root, which
#      makes exactly that edit, then commit and push (with a workflow-scoped
#      token if you push it yourself).
#
# It needs nothing the headless job does not already have, plus
# `apt-get install -y xvfb openbox xdotool` before the test step.
# The resolution setting can only fail under a window manager: a maximized
  # or fullscreen window owns its size and silently drops a resize request,
  # which a headless run cannot reproduce. This job runs the game under Xvfb
  # with openbox and measures the window from outside the process.
  window-tests:
    name: Window-level resolution test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Cache Godot 4.7 binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /tmp/godot-bin/godot
          key: ${{ runner.os }}-godot-4.7-stable

      - name: Install Godot 4.7 (stable)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/godot-bin
          cd /tmp/godot-bin
          curl -L -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip"
          unzip -o godot.zip
          mv "Godot_v4.7-stable_linux.x86_64" godot
          chmod +x godot
          rm -f godot.zip
          ./godot --version

      - name: Restore Godot binary from cache
        if: steps.cache-godot.outputs.cache-hit == 'true'
        shell: bash
        run: |
          mkdir -p /tmp/godot-bin
          chmod +x /tmp/godot-bin/godot

      - name: Install Xvfb, a window manager and xdotool
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool

      - name: Import project resources
        shell: bash
        env:
          GODOT_BIN: /tmp/godot-bin/godot
        run: /tmp/godot-bin/godot --headless --import

      - name: Run window-level resolution test
        shell: bash
        env:
          GODOT_BIN: /tmp/godot-bin/godot
        run: bash tests/resolution_window_test.sh
